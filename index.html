<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="RockPaperScissor.css"/>
</head>
<body>
    <div id="header">
        <h1>Rock Paper Scissors</h1>
    </div>


    <div class="choices">
        <div class="choice" id="rock">
            <img src="https://media.geeksforgeeks.org/wp-content/uploads/20210705223618/default.jpeg" />
        </div>
        <div class="choice" id="paper">
            <img src="https://media.geeksforgeeks.org/wp-content/uploads/20210705223645/paper.jpeg" />
        </div>
        <div class="choice" id="scissors">
            <img src="https://www.clipartkey.com/mpngs/m/5-54540_rock-paper-scissors-random-rock-paper-scissors-png.png" />
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p>you</p>
            <p id="user-score">0</p>
        </div>
        <div class="score">
            <p>computer</p>
            <p id="computer-score">0</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Play your turn</p>
    </div>
    


    <script src="RockPaperScissor.js"></script>
</body>
</html>
